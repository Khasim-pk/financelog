<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinanceLog</title>
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <!-- ══════════════════════════════════════════
         HOME VIEW — Quick Add Transaction
    ══════════════════════════════════════════ -->
    <div id="home-view" class="view active">

        <div class="view-header">
            <h2>Add Transaction</h2>
            <button class="icon-btn" onclick="openBudgetSettings()" title="Set Budget">⚙️</button>
        </div>

        <!-- Expense / Income Toggle -->
        <div class="type-toggle">
            <button class="toggle-btn active" id="btn-expense" onclick="setType('expense')">💸 Expense</button>
            <button class="toggle-btn"        id="btn-income"  onclick="setType('income')"> 💰 Income</button>
        </div>

        <!-- Amount -->
        <div class="amount-wrap">
            <span class="rupee">₹</span>
            <input type="number" id="amount-input" placeholder="0" min="0.01" step="0.01" inputmode="decimal">
        </div>

        <!-- Date -->
        <div class="date-row">
            <span class="row-label">Date</span>
            <input type="date" id="date-input">
        </div>

        <!-- Category Grid -->
        <p class="section-label">Category</p>
        <div class="category-grid" id="category-grid"></div>

        <!-- Payment Mode (expenses only) -->
        <div id="payment-section">
            <p class="section-label">Payment Mode</p>
            <div class="pill-group">
                <button class="pill active" data-pay="UPI"         onclick="setPayment(this)">📱 UPI</button>
                <button class="pill"        data-pay="Cash"        onclick="setPayment(this)">💵 Cash</button>
                <button class="pill"        data-pay="Credit Card" onclick="setPayment(this)">💳 Credit Card</button>
            </div>
        </div>

        <!-- Notes -->
        <input type="text" id="notes-input" class="notes-field" placeholder="Notes (optional)" maxlength="120">

        <!-- Save -->
        <button class="save-btn" id="save-btn" onclick="saveTransaction()">Save</button>

    </div><!-- /home-view -->


    <!-- ══════════════════════════════════════════
         HISTORY VIEW
    ══════════════════════════════════════════ -->
    <div id="history-view" class="view">

        <div class="view-header">
            <h2>History</h2>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="week"  onclick="setFilter(this)">This Week</button>
            <button class="filter-tab"        data-filter="month" onclick="setFilter(this)">This Month</button>
            <button class="filter-tab"        data-filter="pick"  onclick="setFilter(this)">Pick Month</button>
        </div>

        <input type="month" id="month-picker" class="month-picker" style="display:none" onchange="loadHistory()">

        <div id="history-list" class="list-container">
            <p class="empty-state">No transactions found</p>
        </div>

    </div><!-- /history-view -->


    <!-- ══════════════════════════════════════════
         SUMMARY VIEW
    ══════════════════════════════════════════ -->
    <div id="summary-view" class="view">

        <div class="view-header">
            <h2>Summary</h2>
        </div>

        <!-- Month Navigator -->
        <div class="month-nav">
            <button onclick="shiftMonth(-1)">◀</button>
            <span id="summary-month-label">October 2026</span>
            <button onclick="shiftMonth(1)">▶</button>
        </div>

        <!-- Income / Expense Cards -->
        <div class="summary-cards">
            <div class="s-card income-card">
                <p class="s-card-label">Total Income</p>
                <p class="s-card-value" id="total-income">₹0</p>
            </div>
            <div class="s-card expense-card">
                <p class="s-card-label">Total Spent</p>
                <p class="s-card-value" id="total-spent">₹0</p>
            </div>
        </div>

        <!-- Budget Bar -->
        <div class="budget-box" id="budget-box">
            <div class="budget-box-header">
                <span>Monthly Budget</span>
                <span id="budget-ratio">— / —</span>
            </div>
            <div class="budget-track">
                <div class="budget-fill" id="budget-fill"></div>
            </div>
            <p class="budget-alert" id="budget-alert" style="display:none">
                ⚠️ You've used 90%+ of your monthly budget!
            </p>
        </div>

        <!-- Category Breakdown -->
        <p class="section-label" style="margin-top:20px">Spending by Category</p>
        <div id="category-breakdown"></div>

        <!-- Payment Mode Breakdown -->
        <p class="section-label" style="margin-top:16px">By Payment Mode</p>
        <div id="payment-breakdown" style="margin-bottom:24px"></div>

    </div><!-- /summary-view -->

</div><!-- /app -->


<!-- ══════════════════════════════════════════
     BOTTOM NAV
══════════════════════════════════════════ -->
<nav class="bottom-nav">
    <button class="nav-btn active" id="nav-home"    onclick="showView('home')">
        <span class="nav-icon">➕</span>
        <span class="nav-label">Add</span>
    </button>
    <button class="nav-btn"        id="nav-history" onclick="showView('history')">
        <span class="nav-icon">📋</span>
        <span class="nav-label">History</span>
    </button>
    <button class="nav-btn"        id="nav-summary" onclick="showView('summary')">
        <span class="nav-icon">📊</span>
        <span class="nav-label">Summary</span>
    </button>
</nav>


<!-- ══════════════════════════════════════════
     BUDGET SETTINGS MODAL
══════════════════════════════════════════ -->
<div class="modal-backdrop" id="budget-modal" style="display:none">
    <div class="modal">
        <h3>Set Monthly Budget</h3>
        <div class="amount-wrap" style="margin-bottom:0">
            <span class="rupee">₹</span>
            <input type="number" id="budget-input" placeholder="e.g. 50000" min="1" inputmode="decimal">
        </div>
        <div class="modal-actions">
            <button class="modal-cancel" onclick="closeBudgetSettings()">Cancel</button>
            <button class="modal-save"   onclick="saveBudget()">Save</button>
        </div>
    </div>
</div>


<!-- Toast notification -->
<div id="toast" class="toast"></div>


<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
